    in patients with symptomatic severe tricuspid regurgitation despite optimal medical therapy, who are
    at intermediate or greater risk for surgery and in whom transcatheter edge-to-edge valve repair is
    clinically appropriate and is expected to reduce tricuspid regurgitation severity to moderate or less,
    as determined by a multidisciplinary heart team.'
  source:
    cite: >-
      U.S. Food and Drug Administration. PMA P230007 approval order: TriClip G4 System (Abbott Medical).
      April 1, 2024.

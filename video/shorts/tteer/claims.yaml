- id: C16
  topic: 'TRILUMINATE Pivotal: full-cohort death, surgery and HF hospitalization at 1 year'
  text: >-
    In the full cohort at 1 year, freedom from death and tricuspid-valve surgery was 90.6% with T-TEER

# T-TEER (the TriClip): the claims of the reel (video/shorts/tteer) and of bonus chapter B8.
# Each claim gives its primary source and the words of that source that support it. status:
# verified (checked at the source on 2026-10-24) or VERIFY (not confirmed; it stays out of the reel
# and the chapter). FDA documents were read as text extracted from the FDA site, and the notes say
# where a table lost its layout. Sources that disagree are named in the note of each claim.
updated: '2026-10-24'
claims:
- id: C01
  topic: 'TRILUMINATE Pivotal: design'
  text: >-
    TRILUMINATE Pivotal randomly assigned patients with symptomatic severe tricuspid regurgitation 1:1
    to transcatheter edge-to-edge repair (TEER) or to medical therapy alone (control) at 65 centers in
    the United States, Canada and Europe.
  value: 1:1 randomization; 65 centers; TEER (TriClip) plus medical therapy vs medical therapy alone
  source:
    cite: >-
      Sorajja P, Whisenant B, Hamid N, et al. Transcatheter Repair for Patients with Tricuspid Regurgitation.
      N Engl J Med 2023;388:1833-1842.
    pmid: '36876753'
    doi: 10.1056/NEJMoa2300525
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=36876753&rettype=abstract&retmode=text
  support: >-
    Patients with symptomatic severe tricuspid regurgitation were enrolled at 65 centers in the United
    States, Canada, and Europe and were randomly assigned in a 1:1 ratio to receive either TEER or medical
    therapy (control).
  status: verified
  note: >-
    Kar et al. 2025 word the arms as 'tricuspid TEER+medical therapy (device group) or medical therapy
    alone (control)'. Registration NCT03904147; funded by Abbott.
- id: C02
  topic: 'TRILUMINATE Pivotal: number randomized (NEJM primary analysis)'
  text: >-
    The NEJM report analyzed 350 randomized patients, 175 in each group; mean age was 78 years and 54.9%
    were women.
  value: 350 randomized (175 TEER, 175 control); mean age 78 years; 54.9% women
  source:
    cite: >-
      Sorajja P, Whisenant B, Hamid N, et al. Transcatheter Repair for Patients with Tricuspid Regurgitation.
      N Engl J Med 2023;388:1833-1842.
    pmid: '36876753'
    doi: 10.1056/NEJMoa2300525
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=36876753&rettype=abstract&retmode=text
  support: >-
    A total of 350 patients were enrolled; 175 were assigned to each group. The mean age of the patients
    was 78 years, and 54.9% were women.
  status: verified
  note: >-
    These 350 were the prespecified primary analysis population (FDA SSED, via WebFetch: 'As planned,
    the primary endpoint analysis was performed on the first 350 patients'). Adaptive enrollment continued
    to 572 randomized patients (see the TRILUMINATE full-cohort claims).
- id: C03
  topic: 'TRILUMINATE Pivotal: primary endpoint definition'
  text: >-
    The primary endpoint was a hierarchical composite of death from any cause or tricuspid-valve surgery,
    then hospitalization for heart failure, then an improvement of at least 15 points in the KCCQ score
    at 1 year.
  value: >-
    Hierarchy: (1) all-cause death or tricuspid-valve surgery; (2) heart-failure hospitalization; (3)
    KCCQ improvement ≥15 points at 1 year
  source:
    cite: >-
      Sorajja P, Whisenant B, Hamid N, et al. Transcatheter Repair for Patients with Tricuspid Regurgitation.
      N Engl J Med 2023;388:1833-1842.
    pmid: '36876753'
    doi: 10.1056/NEJMoa2300525
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=36876753&rettype=abstract&retmode=text
  support: >-
    a hierarchical composite that included death from any cause or tricuspid-valve surgery; hospitalization
    for heart failure; and an improvement in quality of life ... an increase of at least 15 points in
    the KCCQ score
  status: verified
  note: >-
    NEJM reports the result as a win ratio. The FDA SSED describes a Finkelstein-Schoenfeld test as the
    primary analysis and the win ratio as a supplementary analysis.
- id: C04
  topic: 'TRILUMINATE Pivotal: primary endpoint result (NEJM)'
  text: >-
    In the NEJM report the primary endpoint favored TEER, with a win ratio of 1.48 (95% CI 1.06 to 2.13;
    P = 0.02).
  value: Win ratio 1.48 (95% CI 1.06-2.13); P = 0.02
  source:
    cite: >-
      Sorajja P, Whisenant B, Hamid N, et al. Transcatheter Repair for Patients with Tricuspid Regurgitation.
      N Engl J Med 2023;388:1833-1842.
    pmid: '36876753'
    doi: 10.1056/NEJMoa2300525
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=36876753&rettype=abstract&retmode=text
  support: >-
    The results for the primary end point favored the TEER group (win ratio, 1.48; 95% confidence interval,
    1.06 to 2.13; P = 0.02).
  status: verified
  note: >-
    SOURCES DISAGREE: the FDA SSED gives a win ratio of 1.44 (95% CI 1.03-2.08) for the same 350-patient
    primary analysis population, with data through April 24, 2023 (next claim). Print the number together
    with its source.
- id: C05
  topic: 'TRILUMINATE Pivotal: primary endpoint result (FDA SSED)'
  text: >-
    In the FDA's Summary of Safety and Effectiveness Data, the primary endpoint was met by Finkelstein-Schoenfeld
    testing (two-sided P = 0.0311), and the supplementary win ratio was 1.44 (95% CI 1.03 to 2.08).
  value: Finkelstein-Schoenfeld statistic 2.16, two-sided P = 0.0311; win ratio 1.44 (95% CI 1.03-2.08)
  source:
    cite: >-
      U.S. Food and Drug Administration. Summary of Safety and Effectiveness Data (SSED): TriClip G4 System,
      PMA P230007. 2024.
    url: https://www.accessdata.fda.gov/cdrh_docs/pdf23/P230007B.pdf
  support: >-
    The win ratio of the device group vs. the control group was 1.44 (95% confidence interval of 1.03
    - 2.08).
  status: verified
  note: >-
    Also in the SSED: 'The Finkelstein-Schoenfeld test statistic result was 2.16 with a 2-sided p-value
    of 0.0311' and 'The database for this PMA included data collected through April 24, 2023.' The SSED
    contains no occurrence of 1.48. Read through WebFetch text extraction because the FDA site blocked
    direct PDF download.
- id: C06
  topic: 'TRILUMINATE Pivotal: death, surgery and heart-failure hospitalization at 1 year'
  text: >-
    At 1 year, death or tricuspid-valve surgery and heart-failure hospitalization did not appear to differ
    between the TEER and control groups.
  value: No apparent between-group difference (abstract gives no numbers)
  source:
    cite: >-
      Sorajja P, Whisenant B, Hamid N, et al. Transcatheter Repair for Patients with Tricuspid Regurgitation.
      N Engl J Med 2023;388:1833-1842.
    pmid: '36876753'
    doi: 10.1056/NEJMoa2300525
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=36876753&rettype=abstract&retmode=text
  support: >-
    The incidence of death or tricuspid-valve surgery and the rate of hospitalization for heart failure
    did not appear to differ between the groups.
  status: verified
  note: >-
    The 2025 ESC/EACTS guideline describes the composite benefit as 'exclusively driven by improved quality
    of life [11.7 points (95% CI, 6.8-16.6); P <0.001]'.
- id: C07
  topic: 'TRILUMINATE Pivotal: win-ratio components (FDA SSED)'
  text: >-
    In the FDA analysis, wins for death or tricuspid-valve surgery were similar, heart-failure hospitalization
    wins slightly favored control (6% vs 10%), and the result was driven by KCCQ improvement of at least
    15 points (21% vs 7% wins).
  value: HF-hospitalization wins 6% device vs 10% control; KCCQ ≥15-point wins 21% device vs 7% control
  source:
    cite: >-
      U.S. Food and Drug Administration. Summary of Safety and Effectiveness Data (SSED): TriClip G4 System,
      PMA P230007. 2024.
    url: https://www.accessdata.fda.gov/cdrh_docs/pdf23/P230007B.pdf
  support: >-
    there were slightly more wins in the control group for heart failure hospitalization (6% in the device
    group vs 10% in the control group).
  status: verified
  note: >-
    Next SSED sentence: 'The primary endpoint success was driven by KCCQ score improvement of at least
    15 points, which had 21% wins in the device group and 7% wins in the control group.' Read through
    WebFetch text extraction.
- id: C08
  topic: 'TRILUMINATE Pivotal: TR moderate or less at 30 days'
  text: >-
    At 30 days, tricuspid regurgitation was moderate or less in 87.0% of TEER patients and 4.8% of control
    patients (P<0.001).
  value: 87.0% vs 4.8%
  source:
    cite: >-
      Sorajja P, Whisenant B, Hamid N, et al. Transcatheter Repair for Patients with Tricuspid Regurgitation.
      N Engl J Med 2023;388:1833-1842.
    pmid: '36876753'
    doi: 10.1056/NEJMoa2300525
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=36876753&rettype=abstract&retmode=text
  support: >-
    At 30 days, 87.0% of the patients in the TEER group and 4.8% of those in the control group had tricuspid
    regurgitation of no greater than moderate severity (P<0.001).
  status: verified
  note: >-
    SOURCES DISAGREE on the control value: FDA SSED Table 11 gives 87.0% (141/162) device vs 5.4% (8/147)
    control (read through WebFetch). Full randomized cohort (n=572): 88.9% vs 5.3%.
- id: C09
  topic: 'TRILUMINATE Pivotal: KCCQ change at 1 year'
  text: The KCCQ score rose by 12.3 points with TEER and by 0.6 points with control at 1 year (P<0.001).
  value: +12.3 vs +0.6 points (difference 11.7 points, 95% CI 6.8-16.6, per ESC/EACTS 2025)
  source:
    cite: >-
      Sorajja P, Whisenant B, Hamid N, et al. Transcatheter Repair for Patients with Tricuspid Regurgitation.
      N Engl J Med 2023;388:1833-1842.
    pmid: '36876753'
    doi: 10.1056/NEJMoa2300525
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=36876753&rettype=abstract&retmode=text
  support: >-
    The KCCQ quality-of-life score changed by a mean (±SD) of 12.3±1.8 points in the TEER group, as compared
    with 0.6±1.8 points in the control group (P<0.001).
  status: verified
  note: >-
    Do not print '±1.8 SD'. The FDA SSED shows these are least-squares means with standard errors (next
    claim).
- id: C10
  topic: 'TRILUMINATE Pivotal: KCCQ dispersion is a standard error'
  text: >-
    The ±1.8 attached to the 1-year KCCQ changes is a standard error from an ANCOVA model, not a standard
    deviation; the patient-level standard deviations were about 18 to 22 points.
  value: >-
    Least-squares mean (SE): 12.34 (1.75) device vs 0.61 (1.75) control; complete-case mean ± SD: 15.2
    ± 22.3 vs 4.8 ± 18.3 points
  source:
    cite: >-
      U.S. Food and Drug Administration. Summary of Safety and Effectiveness Data (SSED): TriClip G4 System,
      PMA P230007. 2024.
    url: https://www.accessdata.fda.gov/cdrh_docs/pdf23/P230007B.pdf
  support: Least square means (standard error) from analysis of covariance (ANCOVA) model
  status: verified
  note: >-
    This is the SSED Table 11 footnote for the KCCQ row ('12.34 (1.75)' and '0.61 (1.75)'); SSED Table
    19 gives the complete-case SDs (n not stated). The NEJM abstract labels the same dispersion '(±SD)'.
    Read through WebFetch text extraction.
- id: C11
  topic: 'TRILUMINATE Pivotal: 30-day major adverse events'
  text: Of patients who underwent the TEER procedure, 98.3% were free from major adverse events at 30
    days.
  value: 98.3% freedom from MAE at 30 days (FDA SSED Kaplan-Meier 98.3%, 95% CI 96.3%-100%)
  source:
    cite: >-
      Sorajja P, Whisenant B, Hamid N, et al. Transcatheter Repair for Patients with Tricuspid Regurgitation.
      N Engl J Med 2023;388:1833-1842.
    pmid: '36876753'
    doi: 10.1056/NEJMoa2300525
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=36876753&rettype=abstract&retmode=text
  support: >-
    TEER was found to be safe; 98.3% of the patients who underwent the procedure were free from major
    adverse events at 30 days.
  status: verified
  note: >-
    FDA SSED (via WebFetch): freedom from MAEs at 30 days 98.3% [96.3%, 100%] in the attempted-procedure
    population (n=172); cardiovascular mortality 0.6% (1/172), new-onset renal failure 1.2% (2/172). The
    full randomized cohort reported 98.9% (Tang 2025).
- id: C12
  topic: 'TRILUMINATE Pivotal: major-adverse-event definition and performance goal'
  text: >-
    Major adverse events were a 30-day composite of cardiovascular death, new-onset renal failure, endocarditis
    requiring surgery and non-elective cardiovascular surgery for TriClip-related adverse events, tested
    against a 90% performance goal.
  value: 4-component composite at 30 days; performance goal 90% freedom from MAE
  source:
    cite: >-
      U.S. Food and Drug Administration. Executive Summary, Circulatory System Devices Panel, February
      13, 2024: TriClip G4 System, TRILUMINATE Pivotal Trial.
    url: https://fda.gov/media/176091/download
  support: >-
    major adverse events, including cardiovascular mortality, new onset renal failure, endocarditis requiring
    surgery, and non-elective cardiovascular surgery for TriClip device-related adverse events post-index
    procedure
  status: verified
  note: >-
    WebFetch reported that the FDA PDF text was OCR-garbled and that it corrected spacing and spelling,
    so wording may differ slightly from the original. The 90% goal is also stated by Tang et al. 2025:
    'Freedom from major adverse events was 98.9% for T-TEER (vs performance goal: 90%; P < 0.0001).'

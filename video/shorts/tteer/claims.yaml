  topic: 'FDA approval: indication wording'
  text: >-
    The FDA-approved indication covers patients with symptomatic severe TR despite optimal medical therapy
    who are at intermediate or greater surgical risk and in whom a multidisciplinary heart team judges
    TEER appropriate and expects it to reduce TR to moderate or less; the stated aim is better quality
    of life and functional status.

    doi: 10.1016/j.echo.2026.03.003
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=42242827&rettype=abstract&retmode=text
  support: >-
    Guidelines for the Intraprocedural Imaging for Mitral Valve Transcatheter Edge-to-Edge Repair (M-TEER):
    Recommendations from the American Society of Echocardiography.
  status: VERIFY
  note: >-
    Searched PubMed (J Am Soc Echocardiogr guidelines/standards 2019-2026; EACVI consensus/position statements
    on tricuspid) and the ASE news page. Closest ASE documents: the 2022 ASE TEE screening standards (Hahn
    et al., which include a tricuspid imaging protocol) and the 2026 ACC/AHA/ASE/HRS/STS systems-of-care
    document on tricuspid interventions (O'Gara et al., JACC 2026;87:3360-3378; full text not opened).
    The most detailed step-by-step sources found are Hahn 2025 (Structural Heart) and Onishi et al. 2026.
    A negative search cannot prove absence.
- id: C45
  topic: 'Imaging: TEE views that show each tricuspid leaflet'
  text: >-
    In the mid-esophageal RV inflow-outflow (commissural) view at about 60 degrees, a biplane cut beside
    the aorta shows the anterior and septal leaflets, and a cut beside the posterolateral wall shows the
    posterior and septal leaflets.
  value: >-
    RV inflow-outflow view ~60 deg; biplane near aorta = anterior + septal; near posterolateral wall =
    posterior + septal
  source:
    cite: >-
      Hahn RT, Saric M, Faletra FF, et al. Recommended Standards for the Performance of Transesophageal
      Echocardiographic Screening for Structural Heart Intervention: From the American Society of Echocardiography.
      J Am Soc Echocardiogr 2022;35:1-76.
    pmid: '34280494'
    doi: 10.1016/j.echo.2021.07.006
    url: https://www.asecho.org/wp-content/uploads/2025/04/PIIS0894731721005940.pdf
  support: >-
    Biplane image adjacent to the aorta and thus imaging the anterior and septal leaflet in the orthogonal
    plane.
  status: verified
  note: >-
    Same table (ASE 2022 Table 6): 'Biplane image adjacent to the posterolateral wall and thus imaging
    the posterior and septal leaflet in the orthogonal plane.' Transgastric level: 'At 20–60° mechanical
    rotation ... a single-plane SAX view is obtained' (Hahn 2025 gives 30-60 degrees for the same view).
    These are screening standards, not an intraprocedural guideline.
- id: C46
  topic: 'Imaging: delivery system in the right atrium'
  text: >-
    As the delivery system enters the right atrium from the inferior vena cava, a bicaval view at about
    90 degrees, ideally with live 3D or biplane imaging, tracks its trajectory and keeps it clear of the
    septum, Eustachian valve, Chiari network and pacing leads.
  value: Bicaval view ~90 deg; live 3D or biplane
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    From a bicaval view at ∼90° imaging assesses device trajectory and ensures the device avoids interacting
    with native tissue (i.e., intra-atrial septum, Eustachian valve, Chiari network, pacing hardware,
    or other RA structures).
  status: verified
  note: >-
    Next sentence: 'continuous tracking the device as it is manipulated within the RA is easiest using
    live 3D or biplane imaging'. Hahn also states independent grasping (gripper) controls should be confirmed
    before the device enters the RV.
- id: C47
  topic: 'Imaging: steering toward the valve'
  text: >-
    Flexing the delivery catheter lowers the clip toward the tricuspid annulus, and the imager follows
    it by rotating the TEE probe anticlockwise from the bicaval view until the valve comes into view.
  value: >-
    Bicaval view, then anticlockwise probe rotation; Onishi: bicaval biplane to four-chamber, then RV
    inflow biplane to grasping view
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    flexion of the delivery catheter will lower the device toward the tricuspid annulus ... continuous
    imaging of the device will require anticlockwise rotation of the TEE probe, bringing the TV into view
  status: verified
  note: >-
    Onishi et al. 2026 Table 3, tricuspid column for 'Steering down toward valve': 'Bicaval view bi-plane
    to four chamber view, transitioning to RV inflow view bi-plane to grasping view for tracking clip
    movement toward TV'.
- id: C48
  topic: 'Imaging: clip-arm orientation'
  text: >-
    The clip arms should be oriented perpendicular to the target line of coaptation, aligned most accurately
    on the 3D en face view, with the transgastric short-axis view as an alternative check.
  value: Perpendicular to the coaptation line; 3D en face view with MPR; transgastric SAX as alternative
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    To preserve leaflet geometry, the device should typically be oriented perpendicular to the line of
    coaptation. ... Short-axis transgastric imaging can also be used to evaluate device orientation.
  status: verified
  note: >-
    Hahn: 'Identifying device location and orientation is most accurate using 3D en face view of the TV,
    with MPR used to position the 2 orthogonal 2D images at the intended site of leaflet grasping'. Below
    the valve, transgastric SAX of the leaflet tips is useful 'with the caveat that off-axis imaging of
    the valve may lead to inaccurate position assessment'. Onishi 2026 Table 2 lists 3D en-face, transgastric
    short-axis and 3D MPR for this step (two-column table flattened in extraction). Correction (2026-10-24):
    in Onishi 2026 Table 2 the 3D en-face view is in the mitral column; the tricuspid column lists the
    transgastric short-axis view and 3D MPR. Hahn 2025 supports the 3D en face view for the tricuspid
    valve.
- id: C49
  topic: 'Imaging: leaflet grasping'
  text: >-
    Leaflet capture is guided by 3D multiplanar reconstruction or by 2D single-plane (0-20 or about 140-160
    degrees) or biplane imaging from the commissural (RV inflow-outflow) view with the biplane cursor
    through the device.
  value: 3D MPR, or 2D at 0-20 deg / ~140-160 deg, or biplane from the RV inflow-outflow (commissural)
    view
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    2D single plane (typically at 0° to 20° or ∼140° to 160° mechanical rotation) or biplane imaging using
    the commissural view as the primary image and the biplane marker directly through the device
  status: verified
  note: >-
    Onishi et al. 2026 (Tables 2-3), tricuspid column for leaflet grasping: 'RV inflow view biplane to
    Reverse 4-chamber grasping view', plus 3D en face/transgastric SAX/MPR. Hahn: the imager should see
    leaflet tissue lying on the device arms before capture. Correction (2026-10-24): Onishi's tricuspid
    column for leaflet grasping lists the RV inflow biplane view, the transgastric short axis and MPR,
    not the 3D en face view.
- id: C50
  topic: 'Imaging: gripper ''bounce'' on the right side'
  text: >-
    Unlike mitral TEER, the systolic 'bounce' of the grippers that confirms leaflet capture may not be
    seen on the low-pressure right side.
  value: Qualitative
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    Unlike TEER for the mitral valve, the “bouncing” of the grippers/clasps due to systolic closure of
    the captured native leaflets may not be seen on the low pressure right side.
  status: verified
  note: >-
    SOURCES DIFFER IN EMPHASIS: Onishi et al. 2026 Table 2 lists 'A gripper “bounce” is a useful echocardiographic
    sign confirming leaflet capture' in a step shared by mitral and tricuspid TEER, citing both mitral
    and tricuspid figure panels.
- id: C51
  topic: 'Imaging: confirming leaflet insertion'
  text: >-
    After grasping, a tissue bridge on transgastric short-axis or 3D MPR views confirms leaflet insertion;
    on the tricuspid valve the residual leaflet length is less reliable than on the mitral valve, because
    the leaflets stretch.
  value: 'Tricuspid: tissue bridge on TG SAX or 3D MPR; residual leaflet length less reliable'
  source:
    cite: >-
      Onishi T, Tang GHL, Lerakis S, et al. How to mirror tricuspid transcatheter edge-to-edge repair
      (TEER) to mitral TEER in terms of procedural imaging and device workflow: a step-by-step primer.
      Ann Cardiothorac Surg 2026;15:20.
    pmid: '41988455'
    doi: 10.21037/acs-2025-aw-27-tvd
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC13077618&retmode=xml
  support: >-
    Transgastric short-axis or 3D MPR view showing tissue bridge / Measurement of residual leaflet length
    may be less reliable due to increased leaflet stretchability, which can affect visual estimation
  status: verified
  note: >-
    Onishi 2026 Table 2, tricuspid column (read in the PMC XML, which keeps the columns apart). The mitral
    column holds 'Residual leaflet length is measured and compared to the baseline leaflet length to confirm
    successful capture'. Corrected on 2026-10-24 after an independent check: the first version read the
    flattened table.
- id: C52
  topic: 'Imaging: after clip deployment'
  text: >-
    After deployment the imager assesses residual TR, transtricuspid gradients and valve area, RV function
    and hemodynamic benefit; residual TR is best quantified by 3D vena contracta area because PISA tends
    to overestimate it with a clip in place.
  value: Residual TR (3D VCA preferred); mean gradient and valve area; RV function; hepatic vein flow
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    TR quantitation following T-TEER is most accurately assessed by 3D planimetry of the vena contracta
    area, as the regurgitant orifice area by proximal isovelocity surface area may be distorted by the
    TEER device typically overestimating severity
  status: verified
  note: >-
    Preceding sentence: 'Postdeployment assessment includes evaluation of the severity of residual TR
    (Figure 8g), tricuspid gradients and valve area, RV function, and hemodynamic benefits.' Onishi 2026
    lists 'Trans-tricuspid gradient' and RA pressure/v wave under hemodynamic assessment before release.
- id: C53
  topic: 'Imaging: gradient after a single clip'
  text: Tricuspid gradients and valve area are rarely significantly elevated after a single device.
  value: Qualitative
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    Tricuspid gradients and valve area are rarely significantly elevated following deployment of a single
    device.
  status: verified
- id: C54
  topic: 'Technique: first target leaflets'
  text: >-
    When there is no focal defect or the TR is diffuse, the anteroseptal coaptation line is usually targeted
    first because it is typically the longest.
  value: Anteroseptal first
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    In the absence of a specific anatomic defect, or in cases where the TR is diffuse, the anterior-septal
    leaflets are typically first targeted since this coaptation length is typically the longest
  status: verified
  note: >-
    Besler et al. 2018 (MitraClip-based tricuspid TEER, 117 patients): '185 and 34 clips were implanted
    at the anteroseptal and posteroseptal commissures, respectively.'
- id: C55
  topic: 'Technique: the septal leaflet is always one of the grasped leaflets'
  text: >-
    In tricuspid TEER the septal leaflet is grasped together with either the anterior or the posterior
    leaflet; grasping the anterior and posterior leaflets alone has not been shown to reduce TR.
  value: Septal + anterior, or septal + posterior
  source:
    cite: >-
      Onishi T, Tang GHL, Lerakis S, et al. How to mirror tricuspid transcatheter edge-to-edge repair
      (TEER) to mitral TEER in terms of procedural imaging and device workflow: a step-by-step primer.
      Ann Cardiothorac Surg 2026;15:20.
    pmid: '41988455'
    doi: 10.21037/acs-2025-aw-27-tvd
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC13077618&retmode=xml
  support: >-
    Similarly, in tricuspid TEER, the septal leaflet is grasped with either the anterior or posterior
    leaflet.
  status: verified
  note: >-
    Same source: 'attempts to grasp the anterior and posterior tricuspid leaflets directly (without involving
    the septal leaflet) have not been shown to be effective in reducing TR'.
- id: C56
  topic: 'Technique: zip-and-clip strategy'
  text: >-
    A 'zip and clip' approach, grasping first where the gap is smaller to make grasping easier in the
    target region, can be used, and several devices may be placed along different coaptation lines.
  value: Qualitative
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    a “zip and clip” strategy of grasping a location with a smaller gap to improve the ability to grasp
    the leaflets in the region of interest can also be performed
  status: verified
  note: >-
    Hahn: 'a multidevice strategy may require sequential devices be positioned along different lines of
    coaptation (i.e., anterior-septal and posterior-septal devices)'.
- id: C57
  topic: 'Technique: commissures treated in registry practice'
  text: >-
    In registry data cited by Hahn, the anteroseptal commissure was treated in 66% of cases, the posteroseptal
    in 33% and the anteroposterior in 1%; two clips were needed in 54% and one clip in 37%.
  value: AS 66%, PS 33%, AP 1%; 2 clips 54%, 1 clip 37%
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    T-TEER registry data demonstrates the anterior-septal commissure is treated in 66% of cases, the posterior-septal
    commissure in 33% of cases, and the anterior–posterior commissure in 1% of cases.
  status: VERIFY
  note: >-
    Second-hand number: Hahn cites ref 27 = Wild MG et al., JACC Cardiovasc Interv 2022;15:1352-1363,
    a PASCAL/PASCAL Ace registry (not TriClip). Its abstract does not contain these figures and the full
    text was not opened. For TriClip in TRILUMINATE, use the SSED clip counts instead.
- id: C58
  topic: 3D en face display of the tricuspid valve (guideline)
  text: >-
    The EAE/ASE 3D echocardiography recommendations say the en face tricuspid valve should be displayed
    with the septal leaflet at the 6 o'clock position, whether viewed from the atrium or the ventricle.
  value: Septal leaflet at 6 o'clock, irrespective of perspective
  source:
    cite: >-
      Lang RM, Badano LP, Tsang W, et al. EAE/ASE recommendations for image acquisition and display using
      three-dimensional echocardiography. J Am Soc Echocardiogr 2012;25:3-46.
    pmid: '22183020'
    doi: 10.1016/j.echo.2011.11.010
    url: https://www.asecho.org/wp-content/uploads/2025/04/2012_Three-Dimensional-Echo.pdf
  support: >-
    When displaying the TV en face, the septal leaflet should be located in the 6 o’clock position irrespective
    of perspective (Tables 4 and 6).
  status: verified
  note: >-
    J Am Soc Echocardiogr 2012;25:31. Also p. 19: 'The TV should be displayed with the septal leaflet
    at the 6 o’clock position, irrespective of perspective', and p. 14: from the right-atrial view 'the
    valve should be rotated in plane 45° so that the septal leaflet is located at the 6 o’clock position.'
    (The 45 degree sign is lost in the PDF text layer.)
- id: C59
  topic: 3D en face display in practice
  text: >-
    Many interventional echocardiographers skip the final rotation, so the en face view mimics the transgastric
    short axis, with the septum on the right of the screen and the aorta at about 5 o'clock.
  value: 'Unrotated view: interventricular septum on the right, aorta ~5 o''clock'
  source:
    cite: >-
      Hahn RT, Saric M, Faletra FF, et al. Recommended Standards for the Performance of Transesophageal
      Echocardiographic Screening for Structural Heart Intervention: From the American Society of Echocardiography.
      J Am Soc Echocardiogr 2022;35:1-76.
    pmid: '34280494'
    doi: 10.1016/j.echo.2021.07.006
    url: https://www.asecho.org/wp-content/uploads/2025/04/PIIS0894731721005940.pdf
  support: >-
    Many interventional echocardiographers do not perform the final rotation ... with the interventricular
    septum on the right side of the screen and the aorta located at the 5 o’clock position.
  status: verified
  note: >-
    ASE 2022 restates Lang's display as 'the IAS placed inferiorly (at the 6 o’clock position)' and warns
    the extra z-plane rotation 'could lead to significant confusion in the setting of marked leaflet variability'.
    Hahn 2025 describes the unrotated view as 'septal leaflet is at ∼3 o’clock and aortic leaflet at ∼6
    o’clock' (aorta ~6 vs ~5 o'clock: minor disagreement) and says 'most interventional imagers prefer
    not to rotate the image'. Label the leaflets on screen in the video.
- id: C60
  topic: 'Gradient: TVARC device-performance threshold'
  text: >-
    TVARC defines adequate performance of a TR-reducing device as including absence of tricuspid stenosis,
    with a mean gradient below 5 mmHg.
  value: Mean gradient < 5 mmHg (with TVA ≥1.5 cm2 or TVAi ≥0.9 cm2/m2, DVI <2.2)
  source:
    cite: >-
      Hahn RT, Lawlor MK, Davidson CJ, et al. Tricuspid Valve Academic Research Consortium Definitions
      for Tricuspid Regurgitation and Trial Endpoints. Eur Heart J 2023;44:4508-4532.
    pmid: '37793121'
    doi: 10.1093/eurheartj/ehad653
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC10645050&retmode=xml
  support: >-
    Performance of devices whose purpose is a reduction in TR, should include the absence of tricuspid
    stenosis (TVA ≥ 1.5 cm2 ... DVI < 2.2, mean gradient < 5 mm Hg)
  status: verified
  note: Same document lists TR reduction to 'optimal (≤ mild [1+]) or acceptable (≤ moderate [2+])'.
- id: C61
  topic: 'Gradient: TVARC complication definition'
  text: TVARC lists tricuspid stenosis with a mean gradient above 5 mmHg as a device-related complication.
  value: Mean gradient > 5 mmHg
  source:
    cite: >-
      Hahn RT, Lawlor MK, Davidson CJ, et al. Tricuspid Valve Academic Research Consortium Definitions
      for Tricuspid Regurgitation and Trial Endpoints. Eur Heart J 2023;44:4508-4532.
    pmid: '37793121'
    doi: 10.1093/eurheartj/ehad653
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC10645050&retmode=xml
  support: Tricuspid stenosis (mean gradient > 5 mm Hg)
  status: verified
  note: >-
    Boundary inconsistency inside TVARC: performance requires '< 5' and stenosis is '> 5', so exactly
    5 mmHg is not assigned. For native valves TVARC says a mean gradient '≥5 mm Hg' is suggestive of TS.
- id: C62
  topic: 'Gradient: acceptable range after T-TEER'
  text: >-
    Hahn notes that TVARC treats a mean gradient below 5 mmHg as optimal, but that gradients below 6 to
    9 mmHg could be acceptable by bioprosthetic norms.
  value: <5 mmHg optimal; <6-9 mmHg possibly acceptable
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC12281283&retmode=xml
  support: >-
    Tricuspid Valve Academic Research Consortium suggests that optimal performance of transcatheter devices
    would result in a mean gradient <5 mmHg ... however, based on normative data for bioprosthetic TV
    valves acceptable gradients could be <6-9 mmHg
  status: verified
  note: >-
    Hahn also writes that the transtricuspid gradient 'which may determine outcomes has not been studied';
    but see Coisne 2023 (TriValve), which did study it.
- id: C63
  topic: 'Gradient: TRILUMINATE baseline exclusion'
  text: >-
    TRILUMINATE Pivotal excluded tricuspid stenosis, defined as an orifice of 1.0 cm2 or less and/or a
    mean gradient of 5 mmHg or more by the echo core lab.
  value: TV orifice ≤1.0 cm2 and/or mean gradient ≥5 mmHg
  source:
    cite: >-
      U.S. Food and Drug Administration. Executive Summary, Circulatory System Devices Panel, February
      13, 2024: TriClip G4 System, TRILUMINATE Pivotal Trial.
    url: https://fda.gov/media/176091/download
  support: >-
    Tricuspid valve stenosis, defined as a tricuspid valve orifice ≤1.0 cm2 and/or mean gradient ≥5 mmHg
    assessed by the ECL.
  status: verified
  note: Read through WebFetch (FDA panel executive summary).
- id: C64
  topic: 'Gradient: ESC/EACTS 2025 native severe TS'
  text: >-
    The 2025 ESC/EACTS guideline defines severe native tricuspid stenosis as a mean diastolic gradient
    above 5 mmHg at a normal heart rate.
  value: '> 5 mmHg at normal heart rate'
  source:
    cite: >-
      Praz F, Borger MA, Lanz J, et al. 2025 ESC/EACTS Guidelines for the management of valvular heart
      disease. Eur J Cardiothorac Surg 2025;67:ezaf276.
    pmid: '40878291'
    doi: 10.1093/ejcts/ezaf276
    url: >-
      https://iris.unisr.it/retrieve/e93fadc5-eebc-4ec5-adc3-3f8ded8dc108/ezaf276_compressed-1_compressed.pdf
  support: A mean diastolic transvalvular gradient of >5 mmHg at a normal heart rate indicates severe
    TS.
  status: verified
- id: C65
  topic: 'Gradient: change after TriClip in TRILUMINATE'
  text: >-
    In TRILUMINATE Pivotal the mean diastolic tricuspid gradient rose by 1.15 mmHg at 12 months in the
    device arm vs 0.07 mmHg in controls.
  value: +1.15 ± 1.28 mmHg (n=136) vs +0.07 ± 0.58 mmHg (n=126); difference 1.08 (95% CI 0.84-1.32)
  source:
    cite: >-
      U.S. Food and Drug Administration. Summary of Safety and Effectiveness Data (SSED): TriClip G4 System,
      PMA P230007. 2024.
    url: https://www.accessdata.fda.gov/cdrh_docs/pdf23/P230007B.pdf
  support: Tricuspid valve diastolic mean gradient (CW, mmHg)
  status: verified
  note: >-
    SSED Table 17 row values as extracted: 'Mean ± SD (n) 1.15 ± 1.28 (136) 0.07 ± 0.58 (126)'. Read through
    WebFetch; some Delta symbols were garbled. The SSED gives no absolute post-procedure gradient.
- id: C66
  topic: 'Gradient: prognostic value after T-TEER (TriValve)'
  text: >-
    In 308 TriValve patients, a higher discharge mean tricuspid gradient (top quartile 4.7 ± 2.0 mmHg)
    was not associated with death or heart-failure hospitalization at 1 year.
  value: >-
    Quartiles 0.9, 1.8, 2.8, 4.7 mmHg; 1-year composite 35%, 30%, 40%, 34% (P = 0.60); adjusted HR Q4
    vs Q1-3 1.05 (0.52-2.12)
  source:
    cite: >-
      Coisne A, Scotti A, Taramasso M, et al. Prognostic Value of Tricuspid Valve Gradient After Transcatheter
      Edge-to-Edge Repair: Insights From the TriValve Registry. JACC Cardiovasc Interv 2023;16:706-717.
    pmid: '36948892'
    doi: 10.1016/j.jcin.2023.01.375
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=36948892&rettype=abstract&retmode=text
  support: >-

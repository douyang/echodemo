    In the TVARC grading table, severe TR goes with a severely abnormal tricuspid valve: a flail leaflet,
    a large coaptation gap or marked tethering.
  value: 'Severe (3+): severely abnormal morphology (flail leaflet, large coaptation gap, marked tethering)'
  source: &id001
    cite: >-
      Hahn RT, Lawlor MK, Davidson CJ, et al. Tricuspid Valve Academic Research Consortium Definitions
      for Tricuspid Regurgitation and Trial Endpoints. Eur Heart J 2023;44:4508-4532.
    pmid: '37793121'
    doi: 10.1093/eurheartj/ehad653
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10645050/
  support: Severely abnormal (flail leaflet, large coaptation gap, marked tethering)
  status: verified
  note: >-
    TVARC 2023 Table 4, full text from PMC10645050. The extracted row lost its cell separators; the cell
    is the first of the severe column.
- id: C91
  topic: Mechanism of edge-to-edge repair
  text: >-
    Edge-to-edge devices grasp opposing leaflets and bring them together, which reduces the coaptation
    gaps and the severity of TR.
  value: Qualitative
  source:
    cite: Hahn RT. Echocardiographic Imaging to Guide Tricuspid Interventions. Struct Heart 2025;9:100669.
    pmid: '40704358'
    doi: 10.1016/j.shj.2025.100669
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12281283/
  support: >-
    These devices grasp and bring together opposing leaflets, thereby reducing coaptation gaps and severity
    of TR.
  status: verified
  note: Full text from PMC12281283.
- id: C92
  topic: TR progression
  text: TR of any cause dilates the RV, which can dilate the annulus further and tether the leaflets.
  value: Qualitative
  source: *id001
  support: >-
    Tricuspid regurgitation (TR) of any etiology results in maladaptive dilatation of the right ventricle,
    which can subsequently result in further annular dilatation and tethering of the leaflets.
  status: verified
  note: TVARC 2023 Figure 3 legend, full text from PMC10645050.
- id: C93
  topic: 'TriClip G4 IFU: the arm angles from final positioning to grasping'
  text: >-
    In the TriClip G4 instructions for use, the implant arms open to about 180 degrees in the RA and then
    close to about 60 degrees; the delivery catheter is advanced to put the implant below the valve, the
    arms open to the grasping arm angle, the delivery catheter is retracted, the grippers are lowered,
    and the implant closes to about 60 degrees.
  value: >-
    19.2 open to ~180 deg; 19.7 close to ~60 deg; 20.1 advance below the valve; 20.2 open to the grasping
    arm angle; 20.3 retract; 20.4 lower the grippers; 20.5 close to ~60 deg
  source:
    cite: >-
      U.S. Food and Drug Administration. PMA P230007 approved labeling (Instructions for Use): TriClip
      G4 System. 2024.
    url: https://www.accessdata.fda.gov/cdrh_docs/pdf23/P230007C.pdf
  support: >-
    19.2 "Unlock the Implant and Open the Implant Arms to approximately 180 degrees." 19.7 "Close the
    Implant to an Implant Arm Angle of approximately 60 degrees." 20.1 "Advance the DC distally to position
    the Implant below the valve." 20.2 "Open the Implant Arms to the Grasping Arm Angle." 20.3 "Without
    using excessive force, retract the DC [garbled: to grasp both leaflets]." 20.4 "If the grasp appears
    satisfactory, Lower the Gripper(s) [garbled: onto the leaflets]" 20.5 "Close the Implant until the
    Implant Arm Angle is approximately 60 degrees."
  status: verified
  note: >-
    Read through WebFetch text extraction on 2026-10-24, because the FDA site blocks direct download (as
    for the other IFU claims). Parts of 20.3 and 20.4 are garbled by font encoding in the extracted text;
    the words in brackets are the extraction tool's reading. The grasping arm angle: the IFU gives the
    minimum grasping width at 120 degrees (C33).
- id: C94
  topic: Leaflet grasping steps (primer)
  text: >-
    Below the target leaflets the arms open to 120 to 150 degrees; the delivery catheter is pulled back
    to engage the leaflets, and the grippers are lowered slowly in diastole to grasp them.
  value: Arms 120-150 deg below the leaflets; retract; grippers lowered in diastole
  source: &id002
    cite: >-
      Onishi T, Tang GHL, Lerakis S, et al. How to mirror tricuspid transcatheter edge-to-edge repair
      (TEER) to mitral TEER in terms of procedural imaging and device workflow: a step-by-step primer.
      Ann Cardiothorac Surg 2026;15:20.
    pmid: '41988455'
    doi: 10.21037/acs-2025-aw-27-tvd
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13077618/
  support: >-
    Once the clip is positioned below the target leaflets, the clip arms are opened to 120–150 degrees
    / Retract DC fastener to engage the leaflets for grasping / Grippers are slowly lowered during diastole
    to engage the leaflets
  status: verified
  note: Onishi 2026 Table 2 (steps shared by mitral and tricuspid TEER), full text from PMC13077618.
- id: C95
  topic: Clip release and removal of the system (primer)
  text: >-
    To release the clip, the operator turns the actuator knob and pulls it back, then slowly withdraws
    the delivery catheter from the deployed clip; the delivery system and the steerable guide catheter
    then come out.
  value: Release; delivery system withdrawn; guide removed
  source: *id002
  support: >-
    Rotate the actuator knob counterclockwise for ≥8 full turns, then pull it back to initiate clip release
    / Finally, withdraw the DC fastener SLOWLY to disengage the needle from the deployed clip / SGC removal
  status: verified
  note: Onishi 2026 Table 2, full text from PMC13077618.
- id: C96
  topic: Assessment before deployment (primer)
  text: >-
    Before the clip is deployed, TEE assesses again the leaflet insertion, the reduction of regurgitation
    and the transvalvular gradient.
  value: Leaflet insertion, TR reduction, gradient
  source: *id002
  support: >-
    Reassessment of leaflet insertion, reduction of regurgitation, transvalvular gradient / Repeat assessment
    is performed using the above echo views, to confirm adequate and secure leaflet insertion before clip
    deployment
  status: verified
  note: Onishi 2026 Table 2, full text from PMC13077618.
- id: C97
  topic: Fluoroscopy with TEE (primer)
  text: >-
    Fluoroscopy guides the steps of TEER together with TEE: for example, the view moves from AP to RAO
    while the clip is steered down to the valve.
  value: Fluoroscopy at each step (AP to RAO while steering; RAO for grasping and release)
  source:
    cite: >-
      Onishi T, Tang GHL, Lerakis S, et al. How to mirror tricuspid transcatheter edge-to-edge repair
      (TEER) to mitral TEER in terms of procedural imaging and device workflow: a step-by-step primer.
      Ann Cardiothorac Surg 2026;15:20.
    pmid: '41988455'
    doi: 10.21037/acs-2025-aw-27-tvd
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13077618/
  support: AP transitioning to RAO while steering down
  status: verified
  note: Onishi 2026 Table 3; the fluoroscopy rows span the mitral and tricuspid columns (PMC XML).

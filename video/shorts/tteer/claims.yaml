    doi: 10.1016/j.jacc.2024.10.086
    url: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=39471883&rettype=abstract&retmode=text
  support: >-
    Freedom from all-cause mortality and tricuspid valve surgery through 12 months was 90.6% and 89.9%
